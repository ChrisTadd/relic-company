<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#151411">
  <meta name="relic-build" content="local">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Lead a company of three through the Cinder March, an offline dark fantasy tactics game.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./crest.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./style.css">
  <title>Relic Company</title>
</head>
<body>
  <div id="shell">
    <header class="masthead">
      <span class="wordmark"><img src="./crest.svg" width="34" height="34" alt=""> RELIC COMPANY</span>
      <span id="status" class="status">PREPARING</span>
    </header>
    <main id="screen"></main>
    <nav id="nav" aria-label="Company menus"></nav>
    <div id="error" role="alert" hidden></div>
    <noscript>This game needs JavaScript to run.</noscript>
  </div>
  <script type="module" src="./app.mjs"></script>
</body>
</html>
